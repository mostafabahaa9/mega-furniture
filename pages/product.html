      /* ── VARIANTS MAPPING HELPERS ── */
      function variantsToLegacy(variants) {
        const colorMap = new Map();
        const sizeMap = new Map();
        for (const v of variants) {
          const cn = (v.colorName || v.colorNameAr || "").trim();
          const sn = (v.sizeNameAr || "").trim();
          if (cn && !colorMap.has(cn)) {
            colorMap.set(cn, {
              name: cn,
              nameEn: v.colorNameEn || "",
              hex: v.colorHex || "",
              hex2: v.colorHex2 || "",
              photo: v.colorPhoto || "",
              priceAdd: Number(v.colorPriceAdd) || 0,
            });
          }
          if (sn) {
            if (!sizeMap.has(sn)) {
              sizeMap.set(sn, {
                nameAr: sn,
                nameEn: v.sizeNameEn || "",
                length: v.sizeLength || null,
                width: v.sizeWidth || null,
                depth: v.sizeDepth || null,
                height: v.sizeHeight || null,
                price: Number(v.price) || 0,
              });
            }
          }
        }
        return { colors: [...colorMap.values()], sizes: [...sizeMap.values()] };
      }

      function getVariantDirectPrice(p, colorName, sizeNameAr) {
        if (!p.variants || !p.variants.length) return null;
        const cn = (colorName || "").trim();
        const sn = (sizeNameAr || "").trim();
        const v = p.variants.find(
          (x) =>
            (x.colorName || x.colorNameAr || "").trim() === cn &&
            (x.sizeNameAr || "").trim() === sn,
        );
        return v != null && v.price != null ? Number(v.price) : null;
      }

      function getAvailableStock(p, colorName, sizeNameAr) {
        return Infinity;
      }

      function getCalculatedPrice(product, sizeNameAr, colorName) {
        let basePrice = product.price;
        if (product.variants && product.variants.length) {
          const vPrice = getVariantDirectPrice(product, colorName, sizeNameAr);
          if (vPrice !== null) {
            basePrice = vPrice;
          } else {
            const sizeOnly = product.variants.find(x => (x.sizeNameAr || "").trim() === (sizeNameAr || "").trim());
            if (sizeOnly && sizeOnly.price != null) {
              basePrice = Number(sizeOnly.price);
            }
          }
        }

        const hasDisc = product.salePrice != null && product.salePrice < product.price;
        if (hasDisc) {
          let salePrice = product.salePrice;
          if (product.discountPercent != null) {
            salePrice = Math.round(basePrice * (1 - product.discountPercent / 100));
          } else {
            const diff = product.originalPrice - product.salePrice;
            salePrice = Math.max(0, basePrice - diff);
          }
          return {
            originalPrice: basePrice,
            salePrice: salePrice,
            hasDiscount: true
          };
        }

        return {
          price: basePrice,
          hasDiscount: false
        };
      }

      /* ── GENERAL ANNOUNCEMENTS ── */
      (async function () {
        try {
          if (sessionStorage.getItem("genAnnDismissed")) return;
          const r = await fetch(window.location.origin + "/api/announcement");
          if (!r.ok) return;
          const ann = await r.json();
          if (!ann || !ann.active) return;
          const l = localStorage.getItem("megaLang") || "en";
          const msg = l === "ar" ? ann.message_ar : ann.message_en;
          if (!msg) return;
          let html = msg;
          if (ann.link) {
            const lt =
              l === "ar"
                ? ann.linkText_ar || ann.linkText_en
                : ann.linkText_en || ann.linkText_ar;
            if (lt) {
              let finalLink = ann.link;
              const isSale = msg.toLowerCase().match(/sale|discount|offer|خصم|عرض|تخفيض/);
              if (isSale && finalLink.includes("shop.html")) {
                finalLink = "offers.html";
              }
              html += ` <a href="${finalLink}" style="color:var(--o);text-decoration:none;font-weight:500;margin-inline-start:8px">${lt}</a>`;
            }
          }
          const msgEl = document.getElementById("gen-ann-msg");
          if (msgEl) msgEl.innerHTML = html;
          
          const container = document.getElementById("gen-ann-msg-container");
          if (container) {
            let unitHtml = `<span class="ann-item">${html}</span><span class="ann-bullet">&bull;</span>`;
            let half = unitHtml.repeat(4);
            container.innerHTML = half + half;
          }
          
          const bar = document.getElementById("gen-ann-bar");
          bar.style.display = "flex";
          document.body.classList.add("gen-ann-visible");
        } catch {}
      })();
      
      function dismissGenAnn() {
        sessionStorage.setItem("genAnnDismissed", "1");
        document.getElementById("gen-ann-bar").style.display = "none";
        document.body.classList.remove("gen-ann-visible");
      }

      function toggleWaMenu(e) {
        if (e) e.stopPropagation();
        const menu = document.getElementById("wa-menu");
        if (menu) menu.classList.toggle("show");
      }
      document.addEventListener("click", () => {
        const menu = document.getElementById("wa-menu");
        if (menu) menu.classList.remove("show");
      });

      function loadStats() {
        // Mock function to satisfy general listeners
      }

      /* ── INIT ON LOAD ── */
      updBadge();
      applyLang(lang);

      /* ── SETTINGS FETCH (server-driven defaults for new visitors) ── */
      (function () {
        if (!localStorage.getItem("megaLang") || !localStorage.getItem("megaTheme")) {
          fetch("/api/settings").then(r => r.json()).then(s => {
            if (!localStorage.getItem("megaLang") && s.defaultLanguage) {
              applyLang(s.defaultLanguage);
            }
            if (!localStorage.getItem("megaTheme") && s.defaultTheme) {
              document.documentElement.setAttribute("data-theme", s.defaultTheme);
              localStorage.setItem("megaTheme", s.defaultTheme);
            }
          }).catch(() => {});
        }
      })();
      initProductPage();
    </script>
